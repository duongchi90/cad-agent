name: ChatGPT Local Executor Watchdog

on:
  schedule:
    - cron: '3/12 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: chatgpt-local-executor-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted watchdog code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false

      - name: Fetch recent control-plane comments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          for issue_number in 131 294; do
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100&since=${since}" \
              | jq -s 'add' > "$RUNNER_TEMP/local-executor-comments-${issue_number}.json"
          done

      - name: Evaluate 12-minute watchdog
        id: evaluate
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/watchdog-result.json"
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          from scripts.local_executor_event import find_watchdog_alert

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          alerts = []
          for issue_number in (131, 294):
              comments = json.loads(
                  runner_temp.joinpath(
                      f"local-executor-comments-{issue_number}.json"
                  ).read_text(encoding="utf-8")
              )
              alert = find_watchdog_alert(
                  comments,
                  now=datetime.now(timezone.utc),
                  issue_number=issue_number,
                  repository_owner=os.environ["REPOSITORY_OWNER"],
                  threshold_seconds=720,
              )
              if alert is not None:
                  alert["control_issue_number"] = issue_number
                  alerts.append(alert)
          alert = max(
              alerts,
              key=lambda item: int(str(item["dispatch_comment_id"])),
              default=None,
          )
          print(json.dumps(alert or {}, sort_keys=True))
          PY

          dispatch_id=$(jq -r '.dispatch_comment_id // empty' "$RUNNER_TEMP/watchdog-result.json")
          if [ -z "$dispatch_id" ]; then
            echo "should_alert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_alert=true" >> "$GITHUB_OUTPUT"
          echo "dispatch_comment_id=$dispatch_id" >> "$GITHUB_OUTPUT"
          echo "control_issue_number=$(jq -r '.control_issue_number' "$RUNNER_TEMP/watchdog-result.json")" >> "$GITHUB_OUTPUT"
          echo "control_seq=$(jq -r '.control_seq' "$RUNNER_TEMP/watchdog-result.json")" >> "$GITHUB_OUTPUT"
          echo "state=$(jq -r '.state' "$RUNNER_TEMP/watchdog-result.json")" >> "$GITHUB_OUTPUT"
          echo "age_seconds=$(jq -r '.age_seconds' "$RUNNER_TEMP/watchdog-result.json")" >> "$GITHUB_OUTPUT"

      - name: Post one-shot stalled-execution alert
        if: steps.evaluate.outputs.should_alert == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_COMMENT_ID: ${{ steps.evaluate.outputs.dispatch_comment_id }}
          CONTROL_ISSUE_NUMBER: ${{ steps.evaluate.outputs.control_issue_number }}
          CONTROL_SEQ: ${{ steps.evaluate.outputs.control_seq }}
          WATCHDOG_STATE: ${{ steps.evaluate.outputs.state }}
          AGE_SECONDS: ${{ steps.evaluate.outputs.age_seconds }}
        run: |
          body=$(cat <<EOF
          LOCAL_EXECUTOR_WATCHDOG_V1
          LOCAL_DISPATCH_COMMENT_ID=${DISPATCH_COMMENT_ID}
          CONTROL_SEQ=${CONTROL_SEQ}
          STATE=${WATCHDOG_STATE}
          AGE_SECONDS=${AGE_SECONDS}
          THRESHOLD_SECONDS=720
          ACTION_REQUIRED=CHECK_SELF_HOSTED_RUNNER_OR_LOCAL_EXECUTION
          RUN_ID=${GITHUB_RUN_ID}
          RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          NEXT_OWNER=SOL
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/${CONTROL_ISSUE_NUMBER}/comments" -f body="$body" >/dev/null
