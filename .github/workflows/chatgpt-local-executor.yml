name: ChatGPT Local Executor

on:
  workflow_dispatch:
    inputs:
      expected_branch:
        description: 'Nhánh làm việc bắt buộc phải khớp trên máy local'
        required: false
        default: ''
      expected_sha:
        description: 'Mã Commit SHA bắt buộc phải khớp trên máy local'
        required: false
        default: ''
      command:
        description: 'Lệnh chạy thêm (tuỳ chọn)'
        required: false
        default: ''

jobs:
  inspect-local:
    runs-on: [self-hosted, windows]

    steps:
      - name: Guard Branch & SHA
        shell: powershell
        run: |
          $repoPath = "C:\Users\dkv\Downloads\cad-agent-merge"
          cd $repoPath
          
          $expectedBranch = "${{ github.event.inputs.expected_branch }}"
          $expectedSha = "${{ github.event.inputs.expected_sha }}"
          
          if ($expectedBranch) {
              $currentBranch = git branch --show-current
              if ($currentBranch.Trim() -ne $expectedBranch.Trim()) {
                  Write-Error "Local branch ($currentBranch) does not match expected branch ($expectedBranch)."
                  exit 1
              }
          }
          if ($expectedSha) {
              $currentSha = git rev-parse HEAD
              if (!$currentSha.StartsWith($expectedSha.Trim())) {
                  Write-Error "Local SHA ($currentSha) does not match expected SHA ($expectedSha)."
                  exit 1
              }
          }

      - name: Execute Local State Check
        shell: powershell
        run: |
          # Di chuyển vào thư mục project local thực tế trên máy bạn
          $repoPath = "C:\Users\dkv\Downloads\cad-agent-merge"
          cd $repoPath
          
          # Chạy script Local Executor
          $tempArtifacts = Join-Path $env:RUNNER_TEMP "artifacts"
          .\scripts\local-executor.ps1 -ArtifactsDir $tempArtifacts
          
          # Nếu có lệnh bổ sung được yêu cầu từ trigger
          $extraCmd = "${{ github.event.inputs.command }}"
          if ($extraCmd) {
            Write-Host "Chạy thêm lệnh: $extraCmd"
            Invoke-Expression $extraCmd
          }

      - name: Upload Local State Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-state
          path: ${{ runner.temp }}\artifacts\*
          retention-days: 1
