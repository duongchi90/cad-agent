name: ChatGPT Local Executor

on:
  workflow_dispatch:
    inputs:
      expected_branch:
        description: 'Exact local branch required for this mission'
        required: true
        type: string
      expected_sha:
        description: 'Exact 40-character local commit SHA required for this mission'
        required: true
        type: string
      mission_envelope_json:
        description: 'Sealed CAD Agent local execution envelope JSON'
        required: true
        type: string

jobs:
  inspect-local:
    runs-on: [self-hosted, windows]

    steps:
      - name: Execute sealed local mission
        shell: powershell
        env:
          CAD_AGENT_EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          CAD_AGENT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          CAD_AGENT_MISSION_ENVELOPE_JSON: ${{ inputs.mission_envelope_json }}
        run: |
          $repoPath = "C:\Users\dkv\Downloads\cad-agent-merge"
          Set-Location $repoPath

          $tempArtifacts = Join-Path $env:RUNNER_TEMP "artifacts"
          $missionPath = Join-Path $env:RUNNER_TEMP "cad-agent-mission-envelope.json"
          [System.IO.File]::WriteAllText(
              $missionPath,
              $env:CAD_AGENT_MISSION_ENVELOPE_JSON,
              [System.Text.UTF8Encoding]::new($false)
          )

          .\scripts\local-executor.ps1 `
              -ArtifactsDir $tempArtifacts `
              -MissionEnvelopePath $missionPath `
              -ExpectedBranch $env:CAD_AGENT_EXPECTED_BRANCH `
              -ExpectedSha $env:CAD_AGENT_EXPECTED_SHA

      - name: Upload Local Mission Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-state
          path: ${{ runner.temp }}\artifacts\*
          retention-days: 1
